<!doctype html><html><head><meta charset="utf-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
</head><body><pre id="out">pending</pre>
<script>
// Extract Montserrat glyph outlines (OFL font) for the logo letters, at several weights, as SVG path data in font units.
const BASE = 'https://cdn.jsdelivr.net/gh/JulietaUla/Montserrat@master/fonts/ttf/';
const WEIGHTS = { 600: 'Montserrat-SemiBold.ttf', 700: 'Montserrat-Bold.ttf', 800: 'Montserrat-ExtraBold.ttf', 900: 'Montserrat-Black.ttf' };
const CHARS = 'DIAMCOGRWTH';
(async () => {
  const res = {};
  for (const [w, file] of Object.entries(WEIGHTS)) {
    try {
      const buf = await fetch(BASE + file).then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); });
      const font = opentype.parse(buf);
      const g = {};
      for (const ch of CHARS) {
        const glyph = font.charToGlyph(ch);
        const p = glyph.getPath(0, 0, font.unitsPerEm); // y down, baseline at 0
        g[ch] = { d: p.toPathData(2), adv: glyph.advanceWidth, bbox: p.getBoundingBox() };
      }
      res[w] = { upm: font.unitsPerEm, capH: font.tables.os2.sCapHeight, glyphs: g };
    } catch (e) { res[w] = { error: String(e) }; }
  }
  document.getElementById('out').textContent = JSON.stringify(res);
  await fetch('/glyphs.json', { method: 'POST', body: JSON.stringify(res) });
})();
</script></body></html>
