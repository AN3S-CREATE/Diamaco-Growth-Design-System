<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.row{display:flex;gap:14px}.r{flex:1;display:flex;flex-direction:column;gap:6px;font:500 11px/15px var(--font-sans);color:var(--white-faint)}.r b{color:var(--white);font-weight:600}.box{height:80px;background:var(--black-card);border:1px solid #2a2a2a}</style></head><body><div class="row">
<div class="r"><div class="box" style="border-radius:var(--radius-sm)"></div><b>sm · 4px</b><span>buttons, inputs, pillars</span></div>
<div class="r"><div class="box" style="border-radius:var(--radius-md)"></div><b>md · 8px</b><span>cards, grids, frames</span></div>
<div class="r"><div class="box" style="border-radius:var(--radius-ui)"></div><b>ui · 10px</b><span>audit tiles, icon tiles</span></div>
<div class="r"><div class="box" style="border-radius:var(--radius-lg)"></div><b>lg · 16px</b><span>service visuals, audit card</span></div>
<div class="r"><div class="box" style="border-radius:var(--radius-full);height:40px;margin:20px 0"></div><b>full</b><span>badge, dots, steps</span></div>
</div></body></html>
