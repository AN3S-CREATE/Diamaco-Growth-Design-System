<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.row{display:flex;gap:20px;align-items:flex-end}.m{display:flex;flex-direction:column;gap:8px;align-items:flex-start}.m img{display:block;border:1px solid var(--black-border)}.cap{font-size:12px;line-height:16px;color:var(--white-faint)}.cap b{color:var(--white);font-weight:600}.note{flex:1;font-size:13px;line-height:1.7;color:var(--white-muted);padding-bottom:4px}.note b{color:var(--white)}</style></head><body>
<div class="row">
  <div class="m"><img src="../assets/logos/diamaco-mark-512.png" alt="Diamaco Growth D-mark" width="140" height="140" style="border-radius:var(--radius-lg)"><span class="cap"><b>App / social</b> · radius 16</span></div>
  <div class="m"><img src="../assets/logos/diamaco-mark-512.png" alt="" width="64" height="64" style="border-radius:50%"><span class="cap"><b>Avatar</b></span></div>
  <div class="m"><img src="../assets/logos/diamaco-mark-512.png" alt="" width="32" height="32" style="border-radius:4px"><span class="cap"><b>32px</b></span></div>
  <div class="m"><img src="../assets/logos/diamaco-mark-512.png" alt="" width="16" height="16"><span class="cap"><b>16</b></span></div>
  <p class="note">The D carries the brand when the wordmark won't fit. It ships as a <b>512px PNG on solid black</b>; the site's <code>favicon.svg</code> just wraps the same raster. <b>No vector master exists</b> — don't redraw or trace it.</p>
</div>
</body></html>
