<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;align-items:start}.e{display:flex;flex-direction:column;gap:12px;font:500 11px/15px var(--font-sans);color:var(--white-faint)}.e b{color:var(--white);font-weight:600}.stage{height:84px;display:flex;align-items:center;justify-content:center}.mini{width:100%;height:70px;padding:0}.rv{animation:rv 2.8s var(--ease) infinite}@keyframes rv{0%{opacity:0;transform:translateY(28px)}35%,85%{opacity:1;transform:none}100%{opacity:0}}</style></head><body><div class="row">
<div class="e"><div class="stage"><a class="dg-btn dg-btn--primary" href="#" style="padding:14px 22px"><span>Hover me</span></a></div><b>Fill sweep</b><span>bright red from −101% · lift 2px</span></div>
<div class="e"><div class="stage"><div class="dg-card dg-card--interactive mini"></div></div><b>Card lift</b><span>−4px · .35s cubic-bezier(.25,.46,.45,.94)</span></div>

<div class="e"><div class="stage"><div class="rv" style="width:60px;height:40px;background:var(--black-card);border:1px solid var(--black-border);border-radius:4px"></div></div><b>Scroll reveal</b><span>28px rise · .7s · .1s stagger</span></div>
</div></body></html>
