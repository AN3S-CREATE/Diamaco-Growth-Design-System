<!-- @dsCard group="Effects" viewport="700x220" name="Depth & focus" subtitle="Black drop shadows for lift, red glow for emphasis, red ring for focus" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.row{display:flex;gap:22px}.e{flex:1;display:flex;flex-direction:column;gap:10px;font:500 11px/15px var(--font-sans);color:var(--white-faint)}.e b{color:var(--white);font-weight:600}.box{height:96px;border-radius:var(--radius-md);background:var(--black-card);border:1px solid var(--black-border)}</style></head><body><div class="row">
<div class="e"><div class="box" style="border-color:var(--red-edge);box-shadow:var(--shadow-lift);transform:translateY(-4px);background-image:var(--gradient-sheen)"></div><b>Card hover</b><span>−4px · shadow-lift · red-edge · sheen</span></div>
<div class="e"><div class="box" style="background:var(--red);border-color:var(--red);box-shadow:var(--glow-red)"></div><b>Primary hover</b><span>glow-red 40px</span></div>
<div class="e"><div class="box" style="background:var(--red-wash);border-color:var(--red);box-shadow:var(--glow-red-sm);border-radius:var(--radius-ui)"></div><b>Selected tile</b><span>8% wash · glow-red-sm</span></div>
<div class="e"><div class="box" style="border-color:var(--red);box-shadow:var(--focus-ring);border-radius:var(--radius-sm)"></div><b>Input focus</b><span>red border + 3px 10% ring</span></div>
</div></body></html>
