<!-- @dsCard group="Colors" viewport="700x200" name="Signal red" subtitle="One accent. #cc2222 for fills and marks; #e63030 for hover and small red text" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.row{display:flex;gap:10px}.sw{display:flex;flex-direction:column;gap:3px;font:500 11px/15px var(--font-sans);color:var(--white-faint)}.sw b{color:var(--white);font-weight:600}.chip{height:84px;border-radius:var(--radius-md)}.big{flex:2}.sm{flex:1}.grid{background:var(--black);box-shadow:inset 0 0 0 1px #2a2a2a}</style></head><body><div class="row">
<div class="sw big"><div class="chip" style="background:var(--red)"></div><b>red</b><span>#cc2222 · CTAs, labels, dots, bands</span></div>
<div class="sw big"><div class="chip" style="background:var(--red-bright)"></div><b>red-bright</b><span>#e63030 · hover sweep, small text, focus</span></div>
<div class="sw sm"><div class="chip grid" style="background-image:linear-gradient(var(--red-glow),var(--red-glow))"></div><b>red-glow</b><span>18% · glows</span></div>
<div class="sw sm"><div class="chip grid" style="background-image:linear-gradient(var(--red-tint),var(--red-tint));box-shadow:inset 0 0 0 1px var(--red-line)"></div><b>red-tint / line</b><span>12% / 35%</span></div>
<div class="sw sm"><div class="chip grid" style="box-shadow:inset 0 0 0 1px var(--red-edge)"></div><b>red-edge</b><span>30% · hover border</span></div>
<div class="sw sm"><div class="chip" style="background:var(--whatsapp)"></div><b>whatsapp</b><span>#25d366 · chat button only</span></div>
</div></body></html>
