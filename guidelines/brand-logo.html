<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.row{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:12px}.tile{display:flex;flex-direction:column;gap:8px}.ground{display:flex;align-items:center;justify-content:center;height:180px;border-radius:var(--radius-md);border:1px solid var(--black-border)}.cap{font-size:12px;line-height:16px;color:var(--white-faint)}.cap b{color:var(--white);font-weight:600}.no{position:relative}.no::after{content:"";position:absolute;inset:0;border-radius:var(--radius-md);background:linear-gradient(to top right,transparent calc(50% - 1px),var(--red-bright) 50%,transparent calc(50% + 1px))}</style></head><body>
<div class="row">
  <div class="tile"><div class="ground" style="background:var(--black)"><img src="../assets/logos/diamaco-growth-logo.svg" alt="Diamaco Growth logo" style="width:300px"></div><span class="cap"><b>Primary</b> · diamaco-growth-logo.svg on #0a0a0a / #141414</span></div>
  <div class="tile"><div class="ground" style="background:var(--red)"><img src="../assets/logos/diamaco-growth-logo-mono-white.svg" alt="" style="width:170px"></div><span class="cap"><b>Mono white</b> · photos, red band, 1-colour print</span></div>
  <div class="tile"><div class="ground" style="background:#ffffff"><img src="../assets/logos/diamaco-growth-logo-mono-black.svg" alt="" style="width:170px"></div><span class="cap"><b>Mono black</b> · documents only; colour logo never on light</span></div>
</div>
</body></html>
