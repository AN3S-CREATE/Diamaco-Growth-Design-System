<!-- @dsCard group="Brand" viewport="700x270" name="Logo" subtitle="White DIAMACO, red GROWTH, red D with a slash. Transparent PNG; dark grounds only" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.row{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px}.tile{display:flex;flex-direction:column;gap:8px}.ground{display:flex;align-items:center;justify-content:center;height:180px;border-radius:var(--radius-md);border:1px solid var(--black-border)}.ground img{height:150px;width:auto}.cap{font-size:12px;line-height:16px;color:var(--white-faint)}.cap b{color:var(--white);font-weight:600}.no{position:relative}.no::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent calc(50% - 1px),var(--red-bright) 50%,transparent calc(50% + 1px));border-radius:var(--radius-md)}</style></head><body>
<div class="row">
  <div class="tile"><div class="ground" style="background:var(--black)"><img src="../assets/logos/diamaco-growth-logo.png" alt="Diamaco Growth logo"></div><span class="cap"><b>Primary</b> · on #0a0a0a page black</span></div>
  <div class="tile"><div class="ground" style="background:var(--black-card)"><img src="../assets/logos/diamaco-growth-logo.png" alt="" style="height:120px"></div><span class="cap"><b>On cards</b> · #141414 / #080808</span></div>
  <div class="tile"><div class="ground no" style="background:#ffffff"><img src="../assets/logos/diamaco-growth-logo.png" alt="" style="height:120px"></div><span class="cap"><b>Never on light</b> — the wordmark is white</span></div>
</div>
</body></html>
