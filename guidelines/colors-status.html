<!-- @dsCard group="Colors" viewport="700x200" name="Status" subtitle="Added 2026-10-13 for alerts and toasts only; ratios are against #141414 cards. Red stays the brand accent" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:3px;font:500 11px/15px var(--font-sans);color:var(--white-faint)}.sw b{color:var(--white);font-weight:600}.chip{height:64px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:8px 10px;font:600 11px/1 var(--font-sans);color:#0a0a0a}.tint{height:28px;border-radius:var(--radius-sm);margin-top:4px;border:1px solid var(--black-border)}</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:var(--success)">6.9 : 1</div><div class="tint" style="background:linear-gradient(var(--success-tint),var(--success-tint)),var(--black-card)"></div><b>success</b><span>#34b37a · tint 12%</span></div>
<div class="sw"><div class="chip" style="background:var(--warning)">8.4 : 1</div><div class="tint" style="background:linear-gradient(var(--warning-tint),var(--warning-tint)),var(--black-card)"></div><b>warning</b><span>#e6a23c · tint 12%</span></div>
<div class="sw"><div class="chip" style="background:var(--info)">6.5 : 1</div><div class="tint" style="background:linear-gradient(var(--info-tint),var(--info-tint)),var(--black-card)"></div><b>info</b><span>#7c9cc4 · tint 12%</span></div>
<div class="sw"><div class="chip" style="background:var(--danger)">4.2 : 1</div><div class="tint" style="background:linear-gradient(var(--danger-tint),var(--danger-tint)),var(--black-card)"></div><b>danger</b><span>= red-bright #e63030</span></div>
</div></body></html>
