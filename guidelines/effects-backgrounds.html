<!-- @dsCard group="Effects" viewport="700x230" name="Backgrounds" subtitle="Faint red radial light, an 80px grid masked to centre, film grain. Never a flat red field except the CTA band" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.e{display:flex;flex-direction:column;gap:8px;font:500 11px/15px var(--font-sans);color:var(--white-faint)}.e b{color:var(--white);font-weight:600}.bg{position:relative;overflow:hidden;height:130px;border-radius:var(--radius-md);background:var(--black);border:1px solid var(--black-border)}.bg>div{position:absolute;inset:0}</style></head><body><div class="row">
<div class="e"><div class="bg"><div style="background:var(--gradient-hero)"></div><div style="background-image:var(--grid-lines);background-size:24px 24px;-webkit-mask-image:radial-gradient(80% 80% at 50% 50%,#000,transparent);mask-image:radial-gradient(80% 80% at 50% 50%,#000,transparent)"></div><div style="width:160px;height:160px;left:auto;right:-50px;top:-60px;border-radius:50%;background:var(--gradient-orb)"></div></div><b>Home hero</b><span>washes + grid + orbs</span></div>
<div class="e"><div class="bg"><div style="background:var(--gradient-page-hero)"></div></div><b>Inner page hero</b><span>red glow from top centre</span></div>
<div class="e"><div class="bg" style="background:var(--black-card)"><div style="background:var(--gradient-spot)"></div></div><b>Service visual</b><span>18% red spot</span></div>
<div class="e"><div class="bg"><div style="background-image:var(--noise);opacity:1"></div><div style="background-image:var(--noise);opacity:1"></div><div style="background-image:var(--noise)"></div></div><b>Film grain</b><span>body.dg-grain (shown ×3)</span></div>
</div></body></html>
