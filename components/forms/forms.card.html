<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:24px}.audit{overflow:hidden;background:rgba(18,18,18,.75);border:1px solid #242424;border-radius:var(--radius-lg);box-shadow:var(--shadow-float)}.body{padding:24px 28px}.q{display:block;margin:0 0 14px;font-size:.92rem;font-weight:600;color:#eee}.q b{color:var(--red-bright);margin-right:6px}.mt{margin-top:22px}.contact{margin-top:24px}.dg-choices{grid-template-columns:1fr 1fr}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { StepProgress, ChoiceGrid, PillGroup, Field, FormRow, Select, Button, SERVICES } = window.DIAMACOGROWTH_83a452;
function Demo() {
  const [industry, setIndustry] = React.useState('logistics');
  const [size, setSize] = React.useState('6 – 15 Staff');
  return (
    <>
      <div className="audit">
        <StepProgress step={1} total={3} title="Company Profile & Sector" />
        <div className="body">
          <span className="q"><b>1.1</b>Which industry best describes your business?</span>
          <ChoiceGrid label="Industry" value={industry} onChange={setIndustry} options={[
            { value: 'pro', icon: 'briefcase', title: 'Professional & Advisory', desc: 'Accounting, Legal, Consulting, Finance' },
            { value: 'logistics', icon: 'truck', title: 'Logistics & Fleet', desc: 'Transport, Courier, Supply Chain' },
            { value: 'construction', icon: 'hard-hat', title: 'Construction & Mining', desc: 'Contractors, Engineering, Industrial Supply' },
            { value: 'retail', icon: 'shopping-bag', title: 'Retail & E-Commerce', desc: 'Wholesale, B2C/B2B Storefronts' },
          ]} />
          <span className="q mt"><b>1.2</b>Team size</span>
          <PillGroup label="Team size" value={size} onChange={setSize} options={['1 (Solo Founder)', '2 – 5 Staff', '6 – 15 Staff', '16 – 50 Staff', '50+ Enterprise']} />
        </div>
      </div>
      <div className="contact">
        <FormRow>
          <Field label="Full name" placeholder="Your name" />
          <Field label="Email" type="email" placeholder="you@company.co.za" error="Please enter a valid email address" defaultValue="thandi@" />
        </FormRow>
        <FormRow>
          <Field label="Service"><Select placeholder="Select a service" options={SERVICES.map((s) => s.title)} /></Field>
          <div style={{ alignSelf: 'end', marginBottom: 20 }}><Button block arrow>Send message</Button></div>
        </FormRow>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
